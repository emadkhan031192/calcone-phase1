name: Build CalcOne APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Fix old Android embedding
        run: |
          rm -rf android
          flutter create --project-name calcone_phase1 --org com.calcone .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calcone-phase1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
